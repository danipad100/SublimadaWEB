<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel administrativo — Sublimada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --berry:#AB4871; --berry-dark:#6E2C48; --pink:#E87EB0; --teal:#00B5BC; --teal-dark:#087478;
    --ink:#241118; --paper:#FAF6F5; --line:rgba(36,17,24,0.1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter',sans-serif; background:var(--paper); color:var(--ink);}
  h1,h2{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; letter-spacing:-0.02em;}
  header{
    display:flex; align-items:center; justify-content:space-between; padding:18px 5vw;
    background:#fff; border-bottom:3px solid var(--pink);
  }
  .logo{color:var(--pink); font-size:20px; font-weight:800; font-family:'Bricolage Grotesque';}
  main{padding:32px 5vw; max-width:1000px; margin:0 auto;}
  .login-box{max-width:340px; margin:80px auto; background:#fff; border-radius:16px; padding:28px; border:1px solid var(--line);}
  .login-box input{width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--line); font-size:14px; margin-top:10px;}
  .btn{
    background:var(--pink); color:#fff; border:none; font-weight:600; font-size:14px;
    padding:11px 20px; border-radius:100px; cursor:pointer; width:100%; margin-top:14px;
  }
  .btn-small{width:auto; padding:8px 16px; font-size:13px;}
  .btn-secondary{background:var(--teal-dark);}
  table{width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; margin-top:20px;}
  th,td{text-align:left; padding:12px 14px; font-size:13px; border-bottom:1px solid var(--line);}
  th{background:#FFF3F8; color:var(--berry-dark); font-weight:600; text-transform:uppercase; font-size:11px; letter-spacing:0.04em;}
  .estado{padding:4px 10px; border-radius:100px; font-size:11px; font-weight:600;}
  .estado-pendiente{background:#FAEEDA; color:#854F0B;}
  .estado-pagado{background:#E1F5EE; color:#085041;}
  .estado-entregado{background:#CDF3F1; color:var(--teal-dark);}
  .msg{font-size:13px; margin-top:10px; color:var(--teal-dark);}
  .empty{color:rgba(36,17,24,0.5); font-size:14px; padding:20px 0;}
</style>
</head>
<body>

<header>
  <span class="logo">Sublimada · Admin</span>
  <button class="btn btn-small btn-secondary" id="btn-salir" style="display:none;" onclick="salir()">Cerrar sesión</button>
</header>

<div class="login-box" id="login-box">
  <h2 style="font-size:18px; margin-bottom:16px;">Acceso administrativo</h2>
  <input type="email" id="admin-email" placeholder="Correo">
  <input type="password" id="admin-pass" placeholder="Contraseña">
  <button class="btn" onclick="entrar()">Ingresar</button>
  <p class="msg" id="login-msg"></p>
</div>

<main id="panel" style="display:none;">
  <h1 style="font-size:24px; margin-bottom:6px;">Ventas</h1>
  <p style="color:rgba(36,17,24,0.6); font-size:14px;">Confirmá el pago y otorgá el acceso al cliente.</p>
  <table>
    <thead>
      <tr><th>Fecha</th><th>Cliente</th><th>Producto</th><th>Monto</th><th>Método</th><th>Estado</th><th></th></tr>
    </thead>
    <tbody id="tabla-ordenes"></tbody>
  </table>
  <p class="empty" id="empty-msg" style="display:none;">Todavía no hay ventas registradas.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://xksollhvloypspknalwq.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhrc29sbGh2bG95cHNwa25hbHdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NzM5ODAsImV4cCI6MjEwMDE0OTk4MH0.fZ28CxtE3hlKl3w167kHmCIbZIty5eiJtd1cVdbriBk';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function entrar(){
    const email = document.getElementById('admin-email').value.trim();
    const password = document.getElementById('admin-pass').value;
    const msg = document.getElementById('login-msg');
    msg.textContent = 'Ingresando…';
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error){ msg.textContent = 'Correo o contraseña incorrectos.'; return; }

    const { data: adminRow } = await db.from('admins').select('email').eq('email', email).maybeSingle();
    if (!adminRow){
      msg.textContent = 'Esta cuenta no tiene permisos de administrador.';
      await db.auth.signOut();
      return;
    }
    document.getElementById('login-box').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    document.getElementById('btn-salir').style.display = 'inline-block';
    cargarOrdenes();
  }

  async function salir(){
    await db.auth.signOut();
    document.getElementById('login-box').style.display = 'block';
    document.getElementById('panel').style.display = 'none';
    document.getElementById('btn-salir').style.display = 'none';
  }

  function filaHTML(o){
    const fecha = new Date(o.created_at).toLocaleDateString('es-VE', { day:'2-digit', month:'short' });
    const cliente = o.clientes ? `${o.clientes.nombre || ''} ${o.clientes.apellido || ''}`.trim() : '—';
    const producto = o.productos ? o.productos.nombre : '—';
    const puedeConfirmar = o.estado === 'pendiente';
    return `<tr>
      <td>${fecha}</td>
      <td>${cliente}</td>
      <td>${producto}</td>
      <td>USD ${Number(o.monto).toFixed(0)}</td>
      <td>${o.metodo_pago}</td>
      <td><span class="estado estado-${o.estado}">${o.estado}</span></td>
      <td>${puedeConfirmar ? `<button class="btn btn-small" onclick="confirmar('${o.id}','${o.cliente_id}','${o.producto_id}')">Confirmar</button>` : ''}</td>
    </tr>`;
  }

  async function cargarOrdenes(){
    const { data, error } = await db
      .from('ordenes')
      .select('*, clientes(nombre,apellido,email), productos(nombre)')
      .order('created_at', { ascending: false });

    const tbody = document.getElementById('tabla-ordenes');
    const empty = document.getElementById('empty-msg');
    if (error || !data || data.length === 0){
      tbody.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    tbody.innerHTML = data.map(filaHTML).join('');
  }

  async function confirmar(ordenId, clienteId, productoId){
    await db.from('ordenes').update({ estado: 'pagado' }).eq('id', ordenId);
    await db.from('accesos').insert({ cliente_id: clienteId, producto_id: productoId, orden_id: ordenId });
    cargarOrdenes();
  }
</script>
</body>
</html>
